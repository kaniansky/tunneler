name: Keep the server awake

# Render's free plan puts the live server (https://tunneler-online.onrender.com) to sleep after 15 minutes
# without requests; the first visitor then waits ~15 s for it to start. A light request every 10 minutes keeps
# it up (750 free hours a month cover one service around the clock). GitHub may run scheduled jobs late at busy
# times, and pauses them in a repository without activity for 60 days (Actions tab: enable it again).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live server
        run: curl -fsS -o /dev/null --max-time 90 --retry 2 --retry-delay 10 https://tunneler-online.onrender.com/api/rooms
