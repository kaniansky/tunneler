name: CI

# (not for changes that can't affect the game, the server or the apps - owner, 2026-10-28: the homepage, the docs, the
# screenshots, Markdown files, the other workflows; flatpak/ stays - update-check reads its metainfo)
on:
  push:
    branches: ["main", "release/**"]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "screenshots/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/app-build.yml"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/keep-awake.yml"
      - ".github/workflows/linux-repos.yml"
      - ".github/workflows/release-notes.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/site.yml"
      - ".github/workflows/updater-manifest.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "screenshots/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/app-build.yml"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/keep-awake.yml"
      - ".github/workflows/linux-repos.yml"
      - ".github/workflows/release-notes.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/site.yml"
      - ".github/workflows/updater-manifest.yml"

# (the runner images pinned - ubuntu-24.04 here and in every workflow, not ubuntu-latest: a new image comes when we
# move to it, not by itself - owner, 2026-10-27; a silent image change had broken the app builds' Rust cache)
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
