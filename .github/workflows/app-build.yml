name: Desktop app

# The desktop app (src-tauri/: the game's pages in the OS's own web view, online play on a server set
# in the app) for Windows, Linux and macOS, built as small as possible:
#   Windows  tunneler-online-<v>-windows-x64.exe    portable, needs WebView2 (built into Windows 10/11)
#   Linux    tunneler-online-<v>-linux-x64.tar.gz   the binary, needs libwebkit2gtk-4.1
#            ..._amd64.deb / ....x86_64.rpm          packages that pull that in
#   macOS    tunneler-online-<v>-macos-arm64.dmg / -macos-x64.dmg  (unsigned: right click -> Open)
# release.yml calls it for every release and the files are attached to that GitHub release; a push to
# an app/** branch (or a manual run) builds them as workflow artifacts only, to try a change.

on:
  workflow_call:
    inputs:
      tag:
        description: "release tag to build and attach the files to (e.g. v1.3.0)"
        required: true
        type: string
  push:
    branches: ["app/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --no-bundle
          - os: ubuntu-22.04
            name: linux-x64
            args: --bundles deb,rpm
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - os: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Build the web pages (public/)
        run: |
          npm ci
          npm run build

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev librsvg2-dev rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - name: Build the app
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: Collect the files
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          out="tunneler-online-$v-${{ matrix.name }}"
          rel=src-tauri/target/${{ matrix.target }}/release
          [ -d "$rel" ] || rel=src-tauri/target/release
          mkdir dist
          case "${{ matrix.name }}" in
            windows-*) cp "$rel/tunneler-online.exe" "dist/$out.exe" ;;
            linux-*)
              tar -czf "dist/$out.tar.gz" -C "$rel" tunneler-online
              cp "$rel"/bundle/deb/*.deb "dist/tunneler-online-${v}_amd64.deb"
              cp "$rel"/bundle/rpm/*.rpm "dist/tunneler-online-$v.x86_64.rpm" ;;
            macos-*) cp "$rel"/bundle/dmg/*.dmg "dist/$out.dmg" ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

      - name: Attach to the release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
