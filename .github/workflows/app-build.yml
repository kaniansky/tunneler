name: Desktop and Android app

# The desktop app (src-tauri/: the game's pages in the OS's own web view, online play on a server set
# in the app) for Windows, Linux and macOS, built as small as possible:
#   Windows  tunneler-<v>-windows-x64.exe           portable, needs WebView2 (built into Windows 10/11)
#            ...-windows-x64-setup.exe               installer (the installed app updates itself)
#   Linux    tunneler-<v>-linux-x64.tar.gz          the binary, needs libwebkit2gtk-4.1 (-linux-arm64: ARM64)
#            ..._amd64.deb / ....x86_64.rpm          packages that pull that in (_arm64.deb / .aarch64.rpm: ARM64; update with the admin
#                                                    password, or from the apt / dnf repository: linux-repos.yml)
#            tunneler-linux-x64.AppImage             runs anywhere, updates itself - no version in its name:
#                                                    the update writes over the same file (shortcuts keep working)
#   macOS    tunneler-<v>-macos-arm64.dmg / -macos-x64.dmg  (unsigned: right click -> Open)
#   Android  tunneler-<v>-android.apk                to install directly (arm64, armv7, x86_64 in one)
#            tunneler-<v>-android.aab                the same for Google Play
#            (signed with the repository secrets ANDROID_KEYSTORE = the upload keystore as base64,
#            ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; without them unsigned,
#            named ...-android-unsigned.apk / .aab - an unsigned APK doesn't install. docs/ANDROID.md)
# Updates (src-tauri/src/lib.rs, desktop only - the store / the APK channel updates the Android app): with the repository secret TAURI_SIGNING_PRIVATE_KEY (the key whose
# public half is in tauri.conf.json; TAURI_SIGNING_PRIVATE_KEY_PASSWORD if it has one) the setup.exe,
# the AppImage, the .deb, the .rpm and the macOS app (.app.tar.gz) are signed (.sig); release.yml then adds latest.json
# (updater-manifest.yml), which the apps of older versions read to update themselves. Without the
# secret everything else is built the same, just without those.
# release.yml calls it for every release and the files are attached to that GitHub release; a push to
# an app/** branch (or a manual run) builds them as workflow artifacts only, to try a change.
# Caches (owner, 2026-10-25: the Linux build took 10 minutes): the Rust build (rust-cache) and the Linux build
# packages (cache-apt-pkgs-action). A release (a tag) can only restore caches made on main, so a push to main
# that changes the Rust dependencies or this file builds once to fill them (the Rust caches are saved only
# there - a tag's own caches can't be used by the next tag). The Rust version is pinned (RUST_TOOLCHAIN): a new
# one would make every cached crate useless - raise it on purpose (it fills the caches again).

on:
  workflow_call:
    inputs:
      tag:
        description: "release tag to build and attach the files to (e.g. v1.3.0)"
        required: true
        type: string
  push:
    branches: ["app/**", "main"]
    paths: ["src-tauri/Cargo.lock", "src-tauri/Cargo.toml", ".github/workflows/app-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --bundles nsis
          - os: ubuntu-22.04
            name: linux-x64
            args: --bundles deb,rpm,appimage
          # ARM64 Linux (Raspberry Pi, ARM laptops; the Flatpak's aarch64 build): the packages, no AppImage
          - os: ubuntu-22.04-arm
            name: linux-arm64
            args: --bundles deb,rpm
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Build the web pages (public/)
        run: |
          npm ci
          npm run build

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev librsvg2-dev rpm patchelf libfuse2
          version: "1"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > "$RUNNER_TEMP/updater.json"
            extra=(--config "$RUNNER_TEMP/updater.json")
          fi
          npx --yes @tauri-apps/cli@2 build ${{ matrix.args }} "${extra[@]}"

      - name: Collect the files
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          out="tunneler-$v-${{ matrix.name }}"
          rel=src-tauri/target/${{ matrix.target }}/release
          [ -d "$rel" ] || rel=src-tauri/target/release
          mkdir dist
          # an update package and its signature (only built with the signing key)
          upd() { for f in $1; do [ -f "$f" ] && cp "$f" "dist/$2"; [ -f "$f.sig" ] && cp "$f.sig" "dist/$2.sig"; done; return 0; }
          case "${{ matrix.name }}" in
            windows-*)
              cp "$rel/tunneler.exe" "dist/$out.exe"
              upd "$rel/bundle/nsis/*-setup.exe" "$out-setup.exe" ;;
            linux-arm64)
              tar -czf "dist/$out.tar.gz" -C "$rel" tunneler
              upd "$rel/bundle/deb/*.deb" "tunneler-${v}_arm64.deb"
              upd "$rel/bundle/rpm/*.rpm" "tunneler-$v.aarch64.rpm" ;;
            linux-*)
              tar -czf "dist/$out.tar.gz" -C "$rel" tunneler
              upd "$rel/bundle/deb/*.deb" "tunneler-${v}_amd64.deb"
              upd "$rel/bundle/rpm/*.rpm" "tunneler-$v.x86_64.rpm"
              upd "$rel/bundle/appimage/*.AppImage" "tunneler-linux-x64.AppImage" ;;   # (no version: see above)
            macos-*)
              cp "$rel"/bundle/dmg/*.dmg "dist/$out.dmg"
              upd "$rel/bundle/macos/*.app.tar.gz" "$out.app.tar.gz" ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

      - name: Attach to the release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # (gh finds a draft release too and leaves it a draft: release.yml publishes it once everything is attached)
        run: gh release upload "${{ inputs.tag }}" dist/* -R "${{ github.repository }}" --clobber

  # Android (src-tauri/gen/android, docs/ANDROID.md): one universal APK + AAB with arm64, armv7 and x86_64 (no 32-bit
  # x86 - old emulators, next to no phones; owner, 2026-10-25: a minute less per release)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Build the web pages (public/)
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: src-tauri/gen/android/**/*.gradle*

      # (the runner has the Android SDK in $ANDROID_HOME; Gradle fetches the platform / build tools it needs)
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then echo "no ANDROID_KEYSTORE secret: unsigned"; exit 0; fi
          umask 077
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > src-tauri/gen/android/keystore.properties

      - name: Build the app
        # (the library unstripped here: Gradle puts its symbol table into the AAB for Google Play's crash reports -
        # ndk debugSymbolLevel - and strips what goes into the APKs; the desktop builds keep strip = true)
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: npx --yes @tauri-apps/cli@2 android build --apk --aab --ci --target aarch64 armv7 x86_64

      - name: Collect the files
        run: |
          v=$(node -p "require('./package.json').version")
          out=src-tauri/gen/android/app/build/outputs
          mkdir dist
          if [ -f src-tauri/gen/android/keystore.properties ]; then
            cp "$out/apk/universal/release/app-universal-release.apk" "dist/tunneler-$v-android.apk"
            cp "$out/bundle/universalRelease/app-universal-release.aab" "dist/tunneler-$v-android.aab"
          else
            cp "$out/apk/universal/release/app-universal-release-unsigned.apk" "dist/tunneler-$v-android-unsigned.apk"
            cp "$out/bundle/universalRelease/app-universal-release.aab" "dist/tunneler-$v-android-unsigned.aab"
          fi
          rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/upload.jks"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

      - name: Attach to the release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # (gh finds a draft release too and leaves it a draft: release.yml publishes it once everything is attached)
        run: gh release upload "${{ inputs.tag }}" dist/* -R "${{ github.repository }}" --clobber
