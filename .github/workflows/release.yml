name: Release

# A release is made by pushing a version tag (pushes to main only run CI):
#   git tag -a v1.4.1 -m v1.4.1 && git push origin v1.4.1
# It creates the GitHub release with that version's CHANGELOG.md section as its notes
# (tools/changelog-notes.sh), builds the desktop app (app-build.yml) and the Docker image, and uploads
# the homepage (site/). package.json's version and the CHANGELOG.md heading should match the tag.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          { tools/changelog-notes.sh "$v" || echo "Version $v."
            prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "v$v" | head -n1)
            echo
            echo "**Downloads:** the desktop app for Windows, Linux and macOS below; play in the browser at https://tunneler-online.onrender.com/"
            [ -n "$prev" ] && echo "**All changes:** https://github.com/${{ github.repository }}/compare/$prev...v$v"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

  # the desktop app for Windows, Linux and macOS, attached to the release (app-build.yml)
  app:
    needs: release
    uses: ./.github/workflows/app-build.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit           # TAURI_SIGNING_PRIVATE_KEY: signed update packages
    permissions:
      contents: write

  # latest.json for the desktop apps' updater, from the signed packages app attached
  updater:
    needs: [release, app]
    uses: ./.github/workflows/updater-manifest.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    permissions:
      contents: write

  # the apt / dnf repositories at kaniansky.com/tunneler/apt and /rpm with this release's .deb / .rpm
  repos:
    needs: [release, app]
    uses: ./.github/workflows/linux-repos.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit           # REPO_GPG_PRIVATE_KEY, SITE_FTP_*
    permissions:
      contents: read

  # the homepage (site/) at https://kaniansky.com/tunneler/, uploaded by FTPS after every release: fresh
  # screenshots from screenshots/ (tools/site-images.py), the page itself reads the newest release's
  # downloads when it opens. Needs the repository secrets SITE_FTP_USER and SITE_FTP_PASSWORD (and
  # optionally SITE_FTP_HOST: the FTP server's own name, which its TLS certificate is issued for);
  # skipped without them.
  site:
    needs: release
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.SITE_FTP_HOST || 'ing.r4.websupport.sk' }}
      FTP_USER: ${{ secrets.SITE_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.SITE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Fresh screenshots
        run: |
          pip install --quiet pillow
          python3 tools/site-images.py

      - name: Upload site/ to kaniansky.com/tunneler
        if: env.FTP_USER != '' && env.FTP_PASSWORD != ''
        run: |
          umask 077
          printf 'user = "%s:%s"\n' "$FTP_USER" "$FTP_PASSWORD" > "$RUNNER_TEMP/ftp.cfg"
          cd site
          find . -type f | sort | while read -r f; do
            curl -sS --ssl-reqd --ftp-create-dirs -K "$RUNNER_TEMP/ftp.cfg" -T "$f" "ftp://$FTP_HOST/web/tunneler/${f#./}"
            echo "uploaded ${f#./}"
          done
          rm -f "$RUNNER_TEMP/ftp.cfg"

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
