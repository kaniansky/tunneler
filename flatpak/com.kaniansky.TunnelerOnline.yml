id: com.kaniansky.TunnelerOnline
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: tunneler-online
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --device-if=all:!has-input-device
  - --device=input
  - --socket=pulseaudio
  - --share=network
modules:
  - name: tunneler-online
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/kaniansky/tunneler-online/releases/download/v5.0.3/tunneler-online-5.0.3_amd64.deb
        sha256: aceffb5befdd21185847277afc9c8e02d0a1c7e4d749842b899d6d810711121a
        dest-filename: tunneler-online.deb
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/kaniansky/tunneler-online/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/kaniansky/tunneler-online/releases/download/v" + $version + "/tunneler-online-" + $version + "_amd64.deb"'
          is-main-source: true
      - type: file
        url: https://github.com/kaniansky/tunneler-online/releases/download/v5.0.3/tunneler-online-5.0.3_arm64.deb
        sha256: 1885b974053c81494986aec1de43699858e00160272431a9ffad4bface5b49ec
        dest-filename: tunneler-online.deb
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/kaniansky/tunneler-online/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/kaniansky/tunneler-online/releases/download/v" + $version + "/tunneler-online-" + $version + "_arm64.deb"'
      - type: git
        url: https://github.com/kaniansky/tunneler-online.git
        tag: v5.0.3
        commit: a5123c6614923cded35ae31d79c65b59d532a69a
        dest: upstream
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
    build-commands:
      - ar -x tunneler-online.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/tunneler-online -t /app/bin
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/tunneler-online.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/tunneler-online.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/tunneler-online.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 upstream/flatpak/${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 upstream/flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
