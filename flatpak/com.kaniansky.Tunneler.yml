id: com.kaniansky.Tunneler
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: tunneler
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --device-if=all:!has-input-device
  - --device=input
  - --socket=pulseaudio
  - --share=network
modules:
  - name: tunneler
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/kaniansky/tunneler/releases/download/v1.2.4/tunneler-1.2.4_amd64.deb
        sha256: 265ba1dbeca229e3983ab2361b605bb952e4f4f00437e941e44586349c3eb121
        dest-filename: tunneler.deb
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/kaniansky/tunneler/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/kaniansky/tunneler/releases/download/v" + $version + "/tunneler-" + $version + "_amd64.deb"'
          is-main-source: true
      - type: file
        url: https://github.com/kaniansky/tunneler/releases/download/v1.2.4/tunneler-1.2.4_arm64.deb
        sha256: 503f8fc2e7658a9ea6e0398b89c110443a799091a3b3161f12cb2fbb2b314cd1
        dest-filename: tunneler.deb
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/kaniansky/tunneler/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/kaniansky/tunneler/releases/download/v" + $version + "/tunneler-" + $version + "_arm64.deb"'
      - type: git
        url: https://github.com/kaniansky/tunneler.git
        tag: v1.2.4
        commit: bb0bfa86d01f9b304e09564f54e9180767e72511
        dest: upstream
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
    build-commands:
      - ar -x tunneler.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/tunneler -t /app/bin
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/tunneler.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/tunneler.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/tunneler.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 upstream/flatpak/${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 upstream/flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
