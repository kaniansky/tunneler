<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tunneler</title>
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#16130f">
<link rel="stylesheet" href="/css/style.css">
<!-- the page's colors before the code arrives: the modern look unless the original was chosen (gfx.js) -->
<script>try { if (localStorage.getItem("tunneler.gfx") !== "original") document.documentElement.classList.add("modern"); } catch (e) { document.documentElement.classList.add("modern"); }</script>
</head>
<body>
<div class="screen">
  <div class="stage">
    <canvas id="screen" class="game" width="720" height="400" aria-label="Tunneler"></canvas>
    <div id="loading" class="loading" role="status"><span>Loading</span><span class="cursor">_</span></div>
  </div>
  <canvas id="status" class="status" width="720" height="32" style="display: none"></canvas>
  <noscript><p>TUNNELER needs JavaScript.</p></noscript>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
