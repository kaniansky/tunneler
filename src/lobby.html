<title>{{SESSION_NAME}} - Tunneler</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/lobby.css">
<div class="banner">
<a class="new-game-btn" href="/" data-i18n="newGame">New Game</a>
<div class="left-text" id="sessionName">{{SESSION_NAME}} - <span data-i18n="lobbySuffix">Lobby</span></div>
<button id="copyLink" class="copy-link-btn" type="button" data-i18n="copyLink">Copy Link</button>
</div>
<div id="score" class="lobby-score"></div>
<div class="links">
  <button id="blue" class="btn btn-blue" type="button" data-name="{{BLUE_NAME}}"></button>
  <button id="sp" class="btn btn-spectate" type="button" data-i18n="spectateBtn">Spectate</button>
  <button id="green" class="btn btn-green" type="button" data-name="{{GREEN_NAME}}"></button>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/lobby.js"></script>
