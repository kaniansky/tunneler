# Tunneler in Docker.
#
#   docker compose up -d            # run the published image, open http://localhost:8050
#   docker compose up -d --build    # build the image from this checkout instead
#   docker compose pull && docker compose up -d   # update to the latest release
#
# Set TUNNELER_PORT to use another port on the host (e.g. TUNNELER_PORT=80 docker compose up -d).
# Running games are written to the data volume when the container stops and go on after it starts again.
# For HTTPS put a reverse proxy (Caddy, nginx, Traefik...) in front; websockets must be passed through.

services:
  tunneler:
    image: ghcr.io/kaniansky/tunneler:latest
    build: .
    container_name: tunneler
    restart: unless-stopped
    ports:
      - "${TUNNELER_PORT:-8050}:8050"
    environment:
      PORT: "8050"
    # the server's data - shared replays and maps, accounts, the daily leaderboards, the games handed over on a
    # restart (data/<kind>/) - kept across restarts and updates in this volume; or each kind in an S3-compatible
    # bucket of its own (Cloudflare R2...): S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY and S3_BUCKET_REPLAYS /
    # _MAPS / _ACCOUNTS / _CHALLENGES / _STATE (README.md, Hosting)
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8050/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
